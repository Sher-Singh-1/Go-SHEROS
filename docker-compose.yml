services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gosheros
      POSTGRES_PASSWORD: gosheros_dev
      POSTGRES_DB: gosheros
    ports:
      - "5433:5432"
    volumes:
      - gosheros_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gosheros"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gosheros_pgdata:
